<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Новости WebSocket</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f4f6f8;
            color: #1f2937;
        }

        .container {
            width: min(760px, calc(100% - 32px));
            margin: 48px auto;
        }

        .card {
            background: #ffffff;
            border-radius: 12px;
            padding: 24px;
            box-shadow: 0 8px 28px rgba(0, 0, 0, 0.08);
        }

        h1 {
            margin-top: 0;
        }

        .status {
            display: inline-block;
            margin-bottom: 20px;
            padding: 7px 12px;
            border-radius: 20px;
            background: #e5e7eb;
        }

        .status.connected {
            background: #dcfce7;
            color: #166534;
        }

        .status.disconnected {
            background: #fee2e2;
            color: #991b1b;
        }

        #news-list {
            display: grid;
            gap: 12px;
            padding: 0;
            list-style: none;
        }

        .news-item {
            padding: 14px 16px;
            border: 1px solid #e5e7eb;
            border-radius: 8px;
            background: #fafafa;
        }

        .hint {
            margin-top: 24px;
            color: #6b7280;
            line-height: 1.5;
        }

        code {
            background: #eef2f7;
            padding: 2px 5px;
            border-radius: 4px;
        }
    </style>
</head>
<body>
<div class="container">
    <div class="card">
        <h1>Новости</h1>
        <div id="status" class="status disconnected">Нет соединения</div>

        <ul id="news-list">
            <li id="empty-message" class="news-item">Пока новостей нет.</li>
        </ul>

        <p class="hint">
            Новые сообщения приходят через WebSocket автоматически.
            Соединение периодически проверяется сообщением <code>ping</code>.
        </p>
    </div>
</div>

<script>
    const statusElement = document.getElementById('status');
    const newsList = document.getElementById('news-list');
    const emptyMessage = document.getElementById('empty-message');

    let socket = null;
    let pingTimer = null;
    let reconnectTimer = null;

    function setStatus(text, connected) {
        statusElement.textContent = text;
        statusElement.className = connected
            ? 'status connected'
            : 'status disconnected';
    }

    function addNews(message) {
        if (emptyMessage && emptyMessage.parentNode) {
            emptyMessage.remove();
        }

        const item = document.createElement('li');
        item.className = 'news-item';
        item.textContent = message;
        newsList.prepend(item);
    }

    function startPing() {
        stopPing();
        pingTimer = setInterval(() => {
            if (socket && socket.readyState === WebSocket.OPEN) {
                socket.send('ping');
            }
        }, 10000);
    }

    function stopPing() {
        if (pingTimer !== null) {
            clearInterval(pingTimer);
            pingTimer = null;
        }
    }

    function connect() {
        const protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
        socket = new WebSocket(protocol + window.location.host + '/');

        setStatus('Подключение...', false);

        socket.onopen = () => {
            setStatus('Соединение установлено', true);
            startPing();
        };

        socket.onmessage = (event) => {
            if (event.data === 'pong' || event.data === 'Соединение установлено') {
                return;
            }
            addNews(event.data);
        };

        socket.onclose = () => {
            stopPing();
            setStatus('Соединение потеряно. Повторное подключение...', false);

            clearTimeout(reconnectTimer);
            reconnectTimer = setTimeout(connect, 3000);
        };

        socket.onerror = () => {
            setStatus('Ошибка соединения', false);
        };
    }

    connect();
</script>
</body>
</html>
